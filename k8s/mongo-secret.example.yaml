# DO NOT COMMIT the real secret. Create at deploy time:
#   kubectl -n mern create secret generic mongo-secret \
#     --from-literal=ATLAS_URI='mongodb://mongo.mern.svc.cluster.local:27017/sample_training'
apiVersion: v1
kind: Secret
metadata:
  name: mongo-secret
  namespace: mern
type: Opaque
stringData:
  ATLAS_URI: "mongodb://mongo.mern.svc.cluster.local:27017/sample_training"
