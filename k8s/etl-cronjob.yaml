apiVersion: batch/v1
kind: CronJob
metadata:
  name: etl
  namespace: mern
  labels:
    app: etl
spec:
  schedule: "0 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  startingDeadlineSeconds: 300
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: etl
        spec:
          restartPolicy: OnFailure
          containers:
            - name: etl
              image: PLACEHOLDER_ECR/python-etl:latest
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 250m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                capabilities:
                  drop: ["ALL"]
