name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  server:
    name: Server (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mern-project/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mern-project/server/package-lock.json
      - run: npm ci
      - run: node --check server.mjs

  client:
    name: Client (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mern-project/client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mern-project/client/package-lock.json
      - run: npm ci
      - run: CI=true npm test --if-present -- --watchAll=false --passWithNoTests
      - run: npm run build
        env:
          REACT_APP_API_URL: ""

  etl:
    name: ETL (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python-project
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m py_compile ETL.py

  compose-smoke:
    name: Compose smoke test
    runs-on: ubuntu-latest
    needs: [server, client]
    steps:
      - uses: actions/checkout@v4
      - name: Build and start compose stack
        run: docker compose up -d --build
      - name: Wait for server health
        run: |
          for i in {1..30}; do
            curl -fsS http://localhost:5050/healthcheck/ && break
            sleep 2
          done
      - name: Verify CRUD cycle
        run: |
          curl -fsS http://localhost:3000/ | grep -q 'id="root"'
          POST=$(curl -fsS -X POST -H 'Content-Type: application/json' \
            -d '{"name":"ci","position":"x","level":"Intern"}' \
            http://localhost:5050/record)
          echo "$POST"
          curl -fsS http://localhost:5050/record/ | grep -q '"name":"ci"'
      - if: always()
        run: docker compose logs --no-color > compose-logs.txt
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs
          path: compose-logs.txt
